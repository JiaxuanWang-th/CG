mode: train

# 上一阶段 VM 权重（初始化每个 velocity module）
vm_ckpt: experiments/vm/checkpoint_49.pkl
# 续训 CVM 时用 load_ckpt，不要用 vm_ckpt
# load_ckpt: experiments/cvm/checkpoint_39.pkl

components:
  data: train
  transform: cvm
  system: cvm
  model: cvm

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 100
  save_every: 10
  start_epoch: 0
