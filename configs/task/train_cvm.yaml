mode: train
debug: false

vm_ckpt: checkpoints/vm/checkpoint_299.pkl

components:
  data: train_cvm
  transform: cvm
  system: cvm
  model: cvm

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 300
  save_every: 10
  start_epoch: 0
  val_chamfer_every: 2
  val_chamfer_max_samples: 10
