mode: train
debug: false

# CVM multires v2：新 VM best 上 0->300（由 pipeline 写入 vm_ckpt）
vm_ckpt: experiments/vm_max_multires/checkpoint_299.pkl

components:
  data: train_cvm_max_multires_cloud
  transform: cvm_multires
  system: cvm_max_multires_v2
  model: cvm_max

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 300
  save_every: 10
  start_epoch: 0
  val_chamfer_every: 2
  val_chamfer_max_samples: 10
