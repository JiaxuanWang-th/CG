mode: train
seed: 2020

# Official StraightPCF stage 3 (train_straightpcf.py)
#   Adam lr=1e-4, batch=8, max_iters=90000, val_freq=10000
#   velocity_nets.eval() + encoder/decoder.train() + grad through CVM
cvm_ckpt: experiments/cvm_cons1_lr1e5/checkpoint_best_cd0.0002_epoch19.pkl

components:
  data: train_spcf_official
  transform: straightpcf_official
  system: straightpcf_official
  model: straightpcf

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001
  weight_decay: 0

trainer:
  max_iters: 90000
  val_freq: 5000
  start_iter: 0
  log_interval: 100
  # official default: no clipping (float inf)
  max_grad_norm: 1000000000
