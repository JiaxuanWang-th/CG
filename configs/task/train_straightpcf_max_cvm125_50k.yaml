mode: train
seed: 123

# Stage3 on CVM125: train 50k sampling (32768 val). Fresh 0→90k, not from 32768 SPCF ckpt.
cvm_ckpt: experiments/cvm_max/checkpoint_best_cd0.0002_epoch125.pkl

components:
  data: train_spcf_max
  transform: straightpcf_official_50k
  system: straightpcf_max_cvm125_50k
  model: straightpcf_max

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001
  weight_decay: 0

trainer:
  max_iters: 90000
  val_freq: 5000
  start_iter: 0
  log_interval: 100
  max_grad_norm: 1000000000
