mode: train
seed: 123

# 续训 SPCF max：首轮 0→90000；本轮 90001→250000（打包里程碑 200k / 250k）
# CVM 底座仅 init 用；权重以 load_ckpt 为准
cvm_ckpt: experiments/cvm_max/checkpoint_best_cd0.0002_epoch125.pkl
load_ckpt: experiments/straightpcf_max/checkpoint_iter90000.pkl

components:
  data: train_spcf_max
  transform: straightpcf_official
  system: straightpcf_max
  model: straightpcf_max

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00005
  weight_decay: 0

trainer:
  max_iters: 250000
  val_freq: 5000
  start_iter: 90000
  log_interval: 100
  max_grad_norm: 1000000000
  resume_best_chamfer: 0.000138
