mode: train
debug: false

# Official-aligned CVM on vm_max: 4 modules, consistency_weight=10, max EdgeConv
vm_ckpt: experiments/vm_max/checkpoint_best_cd0.0002_epoch89.pkl

components:
  data: train_cvm_max
  transform: cvm
  system: cvm_max
  model: cvm_max

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 100
  save_every: 10
  start_epoch: 0
  val_chamfer_every: 1
  val_chamfer_max_samples: 20
