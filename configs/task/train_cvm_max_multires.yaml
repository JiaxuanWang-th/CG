mode: train
debug: false

# Stage 2 multires 续训 v2：ep237 best -> ep350（+100 epoch，验证续训上限）
load_ckpt: experiments/cvm_max_multires/checkpoint_best_cd0.0001_epoch237.pkl
vm_ckpt: experiments/vm_max_multires/checkpoint_99.pkl

components:
  data: train_cvm_max_multires_cloud
  transform: cvm_multires
  system: cvm_max_multires
  model: cvm_max

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 350
  save_every: 10
  start_epoch: 250
  val_chamfer_every: 2
  val_chamfer_max_samples: 10
