mode: train
debug: false

# VM multires 续训：ep99 -> ep300
load_ckpt: experiments/vm_max_multires/checkpoint_99.pkl

components:
  data: train_vm_max_multires_cloud
  transform: vm_multires
  system: vm_max_multires
  model: vm_max

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 300
  save_every: 10
  start_epoch: 100
  val_chamfer_every: 2
  val_chamfer_max_samples: 10
