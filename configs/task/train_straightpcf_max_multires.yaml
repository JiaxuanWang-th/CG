mode: train
seed: 123

# Stage 3 multires (cloud): set cvm_ckpt to cvm_max_multires best after Stage 2.
cvm_ckpt: experiments/cvm_max_multires/checkpoint_best_cd0.0002_epoch99.pkl

components:
  data: train_spcf_max_multires_cloud
  transform: straightpcf_official_multires
  system: straightpcf_max_multires
  model: straightpcf_max

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001
  weight_decay: 0

trainer:
  max_iters: 90000
  val_freq: 5000
  start_iter: 0
  log_interval: 100
  max_grad_norm: 1000000000
