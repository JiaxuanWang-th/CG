mode: train

# WARNING: EdgeConv is now max-pool (official). Do NOT load experiments/vm/* (mean-pool ckpts).
# Use configs/task/train_vm_max.yaml for max-pool VM training from scratch.
debug: False

components:
  data: train
  transform: vm
  system: vm_max
  model: vm

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 100
  save_every: 20
  start_epoch: 0
  val_chamfer_every: 1
  val_chamfer_max_samples: 20
