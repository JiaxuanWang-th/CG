train_transform:
  augments:
    - __target__: sample
      num_samples: 32768
      num_vertex_samples: 1024
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020
    - __target__: linear
      scale: [0.8, 1.2]
      rotate_x_range: [-180, 180]
      rotate_y_range: [-180, 180]
      rotate_z_range: [-180, 180]
      scale_p: 0.5
      rotate_p: 0.5
    - __target__: patch
      patch_size: 1000
      num_patches: 1
      train_cvm_network: true

validate_transform: &cvm_validate
  augments:
    - __target__: sample
      num_samples: 32768
      num_vertex_samples: 1024
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020
    - __target__: patch
      patch_size: 1000
      num_patches: 1
      train_cvm_network: true

# 整云 Chamfer 验证（与官方 train_cvm validate 一致，无 patch）
validate_chamfer_transform:
  augments:
    - __target__: sample
      num_samples: 32768
      num_vertex_samples: 1024
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.015
      noise_std_max: 0.015
      distribution: laplace

predict_transform: *cvm_validate
