# Same as train_spcf_official but num_workers=0 (school 4090, matches cvm_max)
data_name: &data_name models/model_normalized.obj
loader: &loader obj

train_dataset:
  shuffle: True
  batch_size: 8
  num_workers: 0
  datapath:
    input_dataset_dir: /home/dataset_train
    use_prob: True
    num_files: 10000
    loader: *loader
    data_name: *data_name
    ignore_check: false
    data_path:
      shapenet: [
        [./datalist/train.txt, 1.0],
      ]

validate_dataset:
  shuffle: False
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: /home/dataset_train
    use_prob: False
    loader: *loader
    data_name: *data_name
    ignore_check: false
    data_path:
      shapenet: [
        [./datalist/validate.txt, 1.0],
      ]
